spring:
  application:
    name: link-auth
  profiles:
    active: dev
  # 配置中心：业务配置（link.auth.*）放在 Nacos 的 link-auth.yaml
  # optional: 前缀 = 容错模式 —— Nacos 不可用时服务仍能启动（只是拿不到远端配置）
  # 【自举顺序】Nacos 地址与这行 import 必须在本地可解析，不能放进 Nacos 自己
  config:
    import: optional:nacos:link-auth.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      discovery:
        # 容错模式：SCA 默认 fail-fast=true，Nacos 不可用时"注册失败"会导致服务起不来。
        # 关闭后注册失败只告警，服务照常启动（本地开发不必先起 Docker）
        fail-fast: false
      config:
        group: DEFAULT_GROUP

server:
  port: 8081

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      # 逻辑删除：del_flag 0 未删 / 1 已删
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

# 接口文档
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
