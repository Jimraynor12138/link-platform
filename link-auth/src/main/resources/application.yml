spring:
  application:
    name: link-auth
  profiles:
    active: dev

server:
  port: 8081

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      # 逻辑删除：del_flag 0 未删 / 1 已删
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

# 认证服务自有配置
link:
  auth:
    jwt:
      # 签名密钥：HS256 要求至少 32 字节。
      # 这里刻意【不给默认值】：生产环境必须通过环境变量 LINK_AUTH_JWT_SECRET 注入，
      # 缺失即启动失败（fail-fast），避免"忘记配置就用上一个公开默认密钥"导致令牌可被伪造。
      # 本地开发由 application-dev.yml 提供（该文件已被 .gitignore 排除，不入库）。
      secret: ${LINK_AUTH_JWT_SECRET}
      # Access Token 有效期（秒）：30 分钟
      expiration: 1800
      # Refresh Token 有效期（秒）：7 天
      refresh-expiration: 604800
      # 令牌请求头与前缀
      token-header: Authorization
      token-head: "Bearer "
    # 需要放行的白名单
    # 注意：/auth/refresh 必须免认证 —— 刷新的前提正是 Access Token 已过期，
    # 若不放行则刷新接口永远拿不到有效令牌（参考实现只放行 /auth/login，存在此缺陷）
    permit-all:
      - /auth/login
      - /auth/refresh
      - /doc.html
      - /swagger-ui.html
      - /swagger-ui/**
      - /v3/api-docs/**
      - /webjars/**

# 接口文档
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
