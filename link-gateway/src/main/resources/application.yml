spring:
  application:
    name: link-gateway
  cloud:
    nacos:
      # 注册中心地址（可用环境变量覆盖）
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      discovery:
        # 容错模式：SCA 默认 fail-fast=true，Nacos 不可用时"注册失败"会导致服务起不来。
        # 关闭后注册失败只告警，服务照常启动（本地开发不必先起 Docker）
        fail-fast: false

server:
  port: 8080
