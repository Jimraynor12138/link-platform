spring:
  application:
    name: link-core
  profiles:
    active: dev
  # 配置中心：业务配置（link.core.*）放在 Nacos 的 link-core.yaml
  # optional: 前缀 = 容错模式 —— Nacos 不可用时服务仍能启动（只是拿不到远端配置）
  # 【自举顺序】Nacos 地址与这行 import 必须在本地可解析，不能放进 Nacos 自己
  config:
    import: optional:nacos:link-core.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      discovery:
        # 容错模式：SCA 默认 fail-fast=true，Nacos 不可用时"注册失败"会导致服务起不来。
        # 关闭后注册失败只告警，服务照常启动（本地开发不必先起 Docker）
        fail-fast: false
      config:
        group: DEFAULT_GROUP
    sentinel:
      transport:
        # Sentinel Dashboard 地址（本地 8858；Dashboard 未启动时不影响服务运行）
        dashboard: ${SENTINEL_DASHBOARD_ADDR:localhost:8858}

# Feign 接入 Sentinel：服务间调用按资源名做熔断降级。
# 【注意】这是顶层 feign.* 配置，不是 spring.cloud.sentinel.feign.*（踩过坑）
feign:
  sentinel:
    enabled: true
    # Feign：超时与日志级别属框架级配置，留在本地（只有业务配置才进配置中心）
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
            logger-level: basic
  # 定时任务线程池：默认只有 1 个线程，统计 flush 与兜底扫描会互相排队
  task:
    scheduling:
      pool:
        size: 2

server:
  port: 8082

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，压测时切换 benchmark profile 关闭
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      # 逻辑删除：del_flag 0 未删 / 1 已删
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

# 接口文档
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
knife4j:
  enable: true
  setting:
    language: zh_cn

# Feign 的日志需要先把该客户端的日志级别开到 debug，才会按 logger-level 输出
logging:
  level:
    com.aaf.link.core.client.AuthClient: debug

# ============================================================
# 业务配置已迁至 Nacos 配置中心：DataId = link-core.yaml（group DEFAULT_GROUP）
# 内容同步入库于 deploy/nacos/config/link-core.yaml，可用 deploy/nacos/import-configs.ps1 一键发布
# 本地只保留：应用名 / profile / 端口 / Nacos 地址 / 框架级配置（mybatis-plus、文档）
# ============================================================
