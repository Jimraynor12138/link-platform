# ============================================================
# 基础设施：Nacos（注册中心 + 配置中心）
#
# 用法：
#   docker compose -f deploy/nacos/docker-compose.yml up -d
#   docker compose -f deploy/nacos/docker-compose.yml down
#
# 控制台：http://localhost:8848/nacos （默认账号/密码 nacos / nacos）
#
# 说明：
#   - 单机模式（MODE=standalone）+ 内嵌 Derby 存储，学习/开发够用
#   - 生产必须改造：外置 MySQL 存储 + 开启鉴权 + 集群部署
#   - 【关键】Nacos 2.x 除 8848（HTTP/控制台）外，还需要 9848/9849（gRPC）。
#     只映射 8848 会出现"控制台能打开、客户端连不上"的经典故障。
# ============================================================
services:
  nacos:
    # 与服务端对齐客户端版本：SCA 2023.0.3.2 带的是 nacos-client 2.4.2
    image: nacos/nacos-server:v2.4.2
    container_name: link-nacos
    environment:
      MODE: standalone
      # 学习环境关闭鉴权；生产必须设为 true 并配置 token 密钥
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - "8848:8848"   # HTTP / 控制台
      - "9848:9848"   # gRPC（Nacos 2.x 客户端必须）
      - "9849:9849"   # gRPC（集群间通信，单机也一并映射）
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    restart: unless-stopped

volumes:
  nacos-data:
  nacos-logs:
